<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#241a33;color:#fff;font-family:"PingFang SC",system-ui,sans-serif}
    main{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 78%,rgba(255,196,110,.32) 0 12%,transparent 42%),linear-gradient(180deg,#1c1633 0 46%,#3a2a4d 46% 72%,#4d3350 72%)}
    .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9b8;opacity:.85;animation:twinkle 2.6s ease-in-out infinite alternate}
    .stars i:nth-child(1){left:14%;top:12%}.stars i:nth-child(2){left:32%;top:22%;animation-delay:.5s}.stars i:nth-child(3){left:58%;top:9%;animation-delay:1s}.stars i:nth-child(4){left:76%;top:18%;animation-delay:1.5s}.stars i:nth-child(5){left:88%;top:30%;animation-delay:.8s}
    .castle{position:absolute;right:6%;bottom:34%;width:26%;height:30%;background:#2c2140;clip-path:polygon(0 100%,0 34%,14% 34%,14% 12%,28% 12%,28% 34%,42% 34%,42% 0,58% 0,58% 34%,72% 34%,72% 12%,86% 12%,86% 34%,100% 34%,100% 100%)}
    .trees{position:absolute;left:0;right:0;bottom:28%;height:26%;background:linear-gradient(160deg,transparent 30%,#241c3a 31% 62%,transparent 63%),linear-gradient(200deg,transparent 40%,#2b2144 41% 70%,transparent 71%)}
    .fire{position:absolute;left:50%;bottom:16%;width:120px;height:120px;transform:translateX(-50%)}
    .fire .pot{position:absolute;left:50%;bottom:34px;width:96px;height:64px;transform:translateX(-50%);background:#3d3350;border-radius:14px 14px 40px 40px;box-shadow:inset 0 10px rgba(255,214,140,.28)}
    .fire .pot:before{content:"";position:absolute;left:-12px;top:10px;width:120px;height:10px;border-radius:8px;background:#4a3f60}
    .fire .flame{position:absolute;left:50%;bottom:6px;width:56px;height:34px;transform:translateX(-50%);background:radial-gradient(circle at 50% 100%,#ffd98a 0 30%,#f2953f 55%,transparent 72%);border-radius:50% 50% 40% 40%;animation:flick .5s ease-in-out infinite alternate}
    .steam{position:absolute;left:50%;bottom:96px;width:10px;height:10px;border-radius:50%;background:rgba(255,244,220,.5);animation:rise 2.4s ease-in infinite}
    .steam:nth-of-type(2){animation-delay:.8s}.steam:nth-of-type(3){animation-delay:1.6s}
    .copy{position:absolute;z-index:3;left:24px;right:24px;top:30px}.copy p{margin:0;color:#ffcf7d;font:800 10px/1 monospace;letter-spacing:.18em}.copy h1{margin:9px 0 12px;font:900 40px/1.1 "Songti SC",serif}.copy span{display:block;color:rgba(255,255,255,.78);font-size:14px;line-height:1.85}.copy strong{color:#ffe6a8}
    @keyframes twinkle{to{opacity:.25}}@keyframes flick{to{transform:translateX(-50%) scaleY(1.18)}}@keyframes rise{0%{opacity:0;transform:translate(-50%,0) scale(.6)}30%{opacity:.75}100%{opacity:0;transform:translate(-50%,-70px) scale(1.7)}}
  </style>
</head>
<body><main>
  <div class="stars"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="castle"></div><div class="trees"></div>
  <div class="fire"><span class="steam"></span><span class="steam"></span><span class="steam"></span><div class="pot"></div><div class="flame"></div></div>
  <div class="copy"><p>WORLD 04</p><h1>咪其林异界食堂</h1><span>云层的裂缝吞下了一只猫，和它背上的一口锅。</span><span>这里的精灵、矮人、兽人和龙，都吃得很敷衍。</span><span><strong>所以，它决定开一间食堂。</strong></span></div>
</main><script>
(function(){
  var lang = new URLSearchParams(location.search).get('lang') || 'en';
  var d = lang === 'zh' ? {
    h1: '咪其林异界食堂',
    l1: '云层的裂缝吞下了一只猫，和它背上的一口锅。',
    l2: '这里的精灵、矮人、兽人和龙，都吃得很敷衍。',
    strong: '所以，它决定开一间食堂。'
  } : {
    h1: 'Meowchelin Isekai Kitchen',
    l1: 'A crack in the clouds swallows a cat — and the pot on its back.',
    l2: 'The elves, dwarves, orcs and dragon here all eat badly.',
    strong: 'So it decides to open a kitchen.'
  };
  var h1 = document.querySelector('.copy h1'); if (h1) h1.textContent = d.h1;
  var spans = document.querySelectorAll('.copy span');
  if (spans[0]) spans[0].textContent = d.l1;
  if (spans[1]) spans[1].textContent = d.l2;
  var strong = document.querySelector('.copy strong'); if (strong) strong.textContent = d.strong;
  document.documentElement.lang = lang;
})();
</script>
</body>
</html>
