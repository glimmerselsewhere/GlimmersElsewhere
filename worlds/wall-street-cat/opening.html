<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"PingFang SC",system-ui,sans-serif;background:#0b1a0f;color:#e8f5e9}
    main{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#0b2e18 0%,#0a1520 60%,#080d12 100%)}
    .ticker{position:absolute;top:0;left:0;right:0;height:38px;display:flex;align-items:center;background:rgba(0,20,10,.85);border-bottom:1px solid rgba(80,200,120,.3);overflow:hidden;z-index:2}
    .ticker div{display:flex;gap:18px;padding-left:100%;animation:ticker 18s linear infinite;white-space:nowrap;font:700 13px/1 monospace}
    .ticker span{color:#7fd685}.ticker em{color:#e05555;font-style:normal}
    .cat{position:absolute;bottom:16%;left:50%;transform:translateX(-50%);z-index:3}
    .cat .face{position:relative;width:120px;height:100px;background:#e8a54b;border-radius:48px 48px 36px 36px;box-shadow:inset 0 -8px rgba(180,100,30,.2)}
    .cat .ear{position:absolute;top:-22px;width:34px;height:34px;background:#e8a54b;border-radius:50% 50% 0 0}
    .cat .ear.l{left:8px;transform:rotate(-16deg)}.cat .ear.r{right:8px;transform:rotate(16deg)}
    .cat .eye{position:absolute;top:30px;width:18px;height:22px;background:#fff;border-radius:50%;overflow:hidden}
    .cat .eye.l{left:22px}.cat .eye.r{right:22px}
    .cat .eye i{position:absolute;bottom:2px;left:5px;width:8px;height:10px;background:#2a1a0a;border-radius:50%;animation:look 3s ease-in-out infinite}
    .cat .mouth{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:18px;height:10px;border:2px solid #6a3a10;border-top:0;border-radius:0 0 10px 10px}
    .cat .tie{position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);width:22px;height:28px;background:#c33;border-radius:4px;clip-path:polygon(50% 0,100% 30%,80% 100%,50% 80%,20% 100%,0 30%)}
    .chart{position:absolute;bottom:0;left:0;right:0;height:30%;z-index:1;opacity:.25}
    .chart svg{width:100%;height:100%}
    .copy{position:absolute;z-index:4;left:22px;right:22px;top:60px}
    .copy p{margin:0;color:#7fd685;font:800 10px/1 monospace;letter-spacing:.18em}
    .copy h1{margin:8px 0 10px;font:900 36px/1.1 "Songti SC",serif;color:#f0fff0}
    .copy span{display:block;color:rgba(220,240,220,.8);font-size:13px;line-height:1.8}
    .copy strong{color:#ffe6a8}
    @keyframes ticker{to{transform:translateX(-50%)}}
    @keyframes look{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
  
    .en{display:none}
    body.en .en{display:inline} body.en .zh{display:none}
  </style>
</head>
<body><main>
  <div class="ticker"><div>
    <span class="zh">喵斯拉电动 ▲ 12.5%</span><em class="zh">毛线生物 ▼ 8.3%</em><em class="zh">猫抓板地产 ▼ 5.2%</em><span class="zh">罐头集团 ▲ 2.1%</span><span class="zh">纸箱物流 ▲ 6.8%</span><em class="zh">激光笔实验室 ▼ 3.4%</em>
    <span class="en">Meowsla Motors ▲ 12.5%</span><em class="en">Yarn Bio ▼ 8.3%</em><em class="en">Scratchpost RE ▼ 5.2%</em><span class="en">CanCo ▲ 2.1%</span><span class="en">Cardboard Log ▲ 6.8%</span><em class="en">Laser Labs ▼ 3.4%</em>
  </div></div>
  <div class="chart"><svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M0 80 Q 20 60 40 72 T 80 50 T 120 65 T 160 30 T 200 45 T 240 20 T 280 40 T 320 15 T 360 35 T 400 10" fill="none" stroke="#7fd685" stroke-width="2"/><path d="M0 60 Q 30 80 60 55 T 120 75 T 180 50 T 240 68 T 300 40 T 360 55 T 400 30" fill="none" stroke="#e05555" stroke-width="1.5" stroke-dasharray="4"/></svg></div>
  <div class="cat"><div class="face"><div class="ear l"></div><div class="ear r"></div><div class="eye l"><i></i></div><div class="eye r"><i></i></div><div class="mouth"></div><div class="tie"></div></div></div>
  <div class="copy"><p>WORLD 06</p><h1>华尔街大亨</h1><span>一只穿西装的橘猫，走进了纽约猫交所。</span><span>三个选项，只有一个挣钱。</span><span><strong>你的猫会用颜艺告诉你，选对了还是选错了。</strong></span></div>
</main>
<script>
(function(){
  var lang = new URLSearchParams(location.search).get('lang') || 'en';
  var d = lang === 'zh' ? {
    h1: '华尔街大亨', l1: '一只穿西装的橘猫，走进了纽约猫交所。', l2: '三个选项，只有一个挣钱。', strong: '你的猫会用颜艺告诉你，选对了还是选错了。'
  } : {
    h1: 'Wall Street Meowgnate', l1: 'A suited cat walks into the New York Feline Exchange.', l2: 'Three choices, only one makes money.', strong: 'Your cat\u2019s face tells you if you got it right.'
  };
  var h1 = document.querySelector('.copy h1'); if (h1) h1.textContent = d.h1;
  var spans = document.querySelectorAll('.copy span');
  if (spans[0]) spans[0].textContent = d.l1;
  if (spans[1]) spans[1].textContent = d.l2;
  var strong = document.querySelector('.copy strong'); if (strong) strong.textContent = d.strong;
  document.documentElement.lang = lang;
  document.body.className = lang;
})();
</script>
</body>
</html>
