<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;font-family:"PingFang SC",system-ui,sans-serif;background:#e8ddcb;color:#3b2f24}
    main{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#f4ead8 0 52%,#e3d2b6 52% 100%)}
    .table{position:absolute;left:50%;bottom:16%;width:64%;height:26%;transform:translateX(-50%);background:#c69a63;border-radius:8px;box-shadow:inset 0 0 0 6px #d9b183,0 14px 24px rgba(90,62,38,.18)}
    .table:after{content:"";position:absolute;left:46%;top:26%;width:16%;height:10%;border-radius:50%;background:#f3ead9;box-shadow:24px 10px 0 -3px #eef3ec,0 0 0 4px #e8dcc6}
    .legs i{position:absolute;width:5%;height:16%;background:#b58a58;border-radius:6px;bottom:2%}
    .legs i:first-child{left:26%}.legs i:last-child{right:26%}
    .door{background:#e9dcc6;border:5px solid #c9ab84;border-radius:6px 6px 0 0}
    .door:before{content:"";position:absolute;inset:8px;background:linear-gradient(180deg,rgba(255,238,205,.9),rgba(240,214,170,.5));border-radius:4px;animation:breathe 3.2s ease-in-out infinite alternate}
    .steam i{position:absolute;bottom:42%;width:9px;height:9px;border-radius:50%;background:rgba(255,252,244,.85);animation:rise 2.6s ease-in infinite}
    .steam i:nth-child(1){left:46%}.steam i:nth-child(2){left:52%;animation-delay:.9s}.steam i:nth-child(3){left:49%;animation-delay:1.7s}
    .copy{position:absolute;z-index:3;left:22px;right:22px;top:26px}.copy p{margin:0;color:#a9733c;font:800 10px/1 monospace;letter-spacing:.18em}
    .copy h1{margin:9px 0 12px;font:900 40px/1.1 "Songti SC",serif;color:#3b2f24}
    .copy span{display:block;color:#6b5844;font-size:14px;line-height:1.85}.copy strong{color:#3b2f24}
    @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.5)}30%{opacity:.9}100%{opacity:0;transform:translateY(-70px) scale(1.6)}}
    @keyframes breathe{to{filter:brightness(1.06)}}
  </style>
</head>
<body><main>
  <div class="door"></div>
  <div class="steam"><i></i><i></i><i></i></div>
  <div class="table"></div>
  <div class="legs"><i></i><i></i></div>
  <div class="copy"><p>WORLD 05</p><h1>龙餐馆 · 邻桌</h1><span>你是一只独自来吃饭的猫，四人方桌只摆了一副餐具。</span><span>菜还没上，后厨的门缝里先漏出了声音。</span><span><strong>今晚要靠着耳朵，把四道菜猜出来。</strong></span></div>
</main><script>
(function(){
  var lang = new URLSearchParams(location.search).get('lang') || 'en';
  var d = lang === 'zh' ? {
    h1: '龙餐馆 · 邻桌',
    l1: '你是一只独自来吃饭的猫，四人方桌只摆了一副餐具。',
    l2: '菜还没上，后厨的门缝里先漏出了声音。',
    strong: '今晚要靠着耳朵，把四道菜猜出来。'
  } : {
    h1: 'Dragon Table',
    l1: 'You are a cat dining alone — a table for four, one place set.',
    l2: 'The food has not arrived. The kitchen leaks its voices first.',
    strong: 'Tonight, four dishes must be guessed by ear.'
  };
  var h1 = document.querySelector('.copy h1'); if (h1) h1.textContent = d.h1;
  var spans = document.querySelectorAll('.copy span');
  if (spans[0]) spans[0].textContent = d.l1;
  if (spans[1]) spans[1].textContent = d.l2;
  var strong = document.querySelector('.copy strong'); if (strong) strong.textContent = d.strong;
  document.documentElement.lang = lang;
})();
</script>
</body>
</html>
