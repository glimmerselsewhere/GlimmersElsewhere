<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#29203d;color:white;font-family:"PingFang SC",system-ui,sans-serif}
    main{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#57446e 0 48%,#c5a77f 48%)}
    .room{position:absolute;inset:0;perspective:500px}.room:after{content:"";position:absolute;left:50%;bottom:-35%;width:125%;height:78%;background:repeating-linear-gradient(90deg,transparent 0 70px,rgba(68,49,47,.18) 71px 75px),#c7aa83;transform:translateX(-50%) rotateX(61deg);transform-origin:bottom}
    .door{position:absolute;left:10%;top:8%;width:41%;height:48%;background:#a88161;border:9px solid #352943;box-shadow:inset -14px 0 rgba(39,29,50,.13);animation:close 3.2s ease-in-out both}.light{position:absolute;top:0;left:35%;width:48%;height:75%;background:linear-gradient(135deg,rgba(255,237,176,.6),transparent 70%);clip-path:polygon(0 0,35% 0,100% 100%,40% 100%);animation:fade 3.2s ease-in-out both}
    .paws{position:absolute;z-index:3;left:50%;bottom:20px;transform:translateX(-50%);animation:wake 2.2s ease-out both}.paws i{display:inline-block;width:75px;height:46px;margin:0 13px;border-radius:60% 60% 40% 40%;background:#e4a760;box-shadow:inset 0 -9px rgba(97,56,48,.15);transform:rotate(-7deg)}.paws i:last-child{transform:rotate(7deg)}
    .copy{position:absolute;z-index:4;left:22px;right:22px;top:28px;text-shadow:0 2px 12px #291f3d}.copy p{margin:0;color:#f7ca77;font:800 10px/1 monospace;letter-spacing:.16em}.copy h1{margin:8px 0 12px;font:900 42px/1 "Songti SC",serif}.lines{display:grid;gap:4px;font-size:14px;color:#ded5e5}.lines span{opacity:0;animation:line .5s ease forwards}.lines span:nth-child(2){animation-delay:1s}.lines strong{opacity:0;color:white;animation:line .5s 2s ease forwards}
    @keyframes close{0%,35%{transform:rotateY(-40deg);transform-origin:left}70%,100%{transform:rotateY(0);transform-origin:left}}@keyframes fade{0%,45%{opacity:1}100%{opacity:.2}}@keyframes wake{0%,55%{opacity:0;transform:translate(-50%,30px)}100%{opacity:1;transform:translate(-50%,0)}}@keyframes line{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(7px)}}
  </style>
</head>
<body><main><div class="room"><div class="door"></div><div class="light"></div><div class="paws"><i></i><i></i></div></div><div class="copy"><p>WORLD 01</p><h1>唯咪独尊</h1><div class="lines"><span>人类已经出门。</span><span>房间归于寂静。</span><strong>现在，这里由你巡视。</strong></div></div></main><script>
(function(){
  var lang = new URLSearchParams(location.search).get('lang') || 'en';
  var d = lang === 'zh' ? {
    h1: '唯咪独尊',
    l1: '人类已经出门。',
    l2: '房间归于寂静。',
    strong: '现在，这里由你巡视。'
  } : {
    h1: 'Meow Supreme',
    l1: 'The humans have gone out.',
    l2: 'The room falls quiet.',
    strong: 'Now it is yours to patrol.'
  };
  var h1 = document.querySelector('.copy h1'); if (h1) h1.textContent = d.h1;
  var spans = document.querySelectorAll('.copy .lines span');
  if (spans[0]) spans[0].textContent = d.l1;
  if (spans[1]) spans[1].textContent = d.l2;
  var strong = document.querySelector('.copy .lines strong'); if (strong) strong.textContent = d.strong;
  document.documentElement.lang = lang;
})();
</script>
</body>
</html>
